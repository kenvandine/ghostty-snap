name: Sync with upstream

on:
  # Runs at 04:00 UTC every day
  schedule:
    - cron:  '0 4 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  get-version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stable' # Run only for the 'stable' branch
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_SCOPED_TOKEN }}
          ref: stable
      - name: Fetch release version
        run: |
          VERSION=$(
            curl -sL https://api.github.com/repos/ghostty-org/ghostty/tags | 
            jq .  | grep name | grep -v tip | grep -v beta | grep -v rc | head -n 1 | cut -d'"' -f4
          )
          if [ ${#VERSION} -gt 0 ]; then
            sed -i 's/^\(version: \).*$/\1'"$VERSION"'/' snap/snapcraft.yaml
          fi
          
      - name: Check for modified files
        id: git-check
        run: |
          MODIFIED=$([ -z "`git status --porcelain`" ] && echo "false" || echo "true")
          echo "modified=$MODIFIED" >> $GITHUB_OUTPUT
      - name: Commit latest release version
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'Ken VanDine'
          git config --global user.email 'ken@vandine.org'
          git commit -am "Automatic sync to latest release"
          git push
